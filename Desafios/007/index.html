<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens Flexíveis</title>
</head>
<body>
 <h1>Imagem Flexível</h1>  
 <p>Você está vendo a imagem inteira? Experimente aumentar o tamanho do seu navegador.</p>
 <picture>
  <source media="(min-width:1250px )" srcset="imagens/paisagem-g.png">
  <source media="(min-width:750px )" srcset="imagens/paisagem-m.png">
  <img src="imagens/paisagem-p.png" alt="imagem pequena">
 </picture>
</body>
</html>
