<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeira Tabela</title>
    <style>
        *{
            padding: 0px;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            text-align: center;
        }
        table{
            font-size: 4em;
            width: 600px;
            height: 350px;
            margin: auto;
            border-collapse: collapse;
        }
        table  td{
            padding: 5px;
             border: 1px solid black;
        }
        
    </style>
</head>
<body>
    <h1>Minha Primeira Tabela</h1>
    <table>
     <!--
      HIERARQUIA DE TABELAS(simples)   
       TABLE=tabela
         TABLE ROW=linha de tabela
              TABLE HEADER= Cabeçalho de Tabela
                 TABLE DATA=Dados de tabela
     -->

     <tr>
        <!--Primeira Linha-->
        <td>A1</td>
        <td>B1</td>
        <td>C1</td>
     </tr>
     <tr>
        <td>A2</td>
        <td>B2</td>
        <td>C2</td>
     </tr>
     <tr>
        <td>A3</td>
        <td>B3</td>
        <td>C3</td>
     </tr>
     <tr>
        <td>A4</td>
        <td>B4</td>
        <td>C4</td>
     </tr>
    </table>
</body>
</html>
