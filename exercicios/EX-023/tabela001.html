<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeira Tabela</title>
    <style>
        *{
            padding: 0px;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        .primeira{
            width: 600px;
            height: 100px;
            padding: 5px;
             border: 1.5px solid black;
             margin: auto;
        }
        
        .primeira h1{
           text-align: center;
           font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
           font-weight: lighter;
        }
        .segunda{
            font-size: 4em;
            width: 600px;
            height: 350px;
            margin: auto;
            border-collapse: collapse;
            
        }
        .segunda td{
            text-align: center;
            padding: 5px;
             border: 2px solid black;
        }
        
        .butao:hover{
          background-color: green;
        }
        
    </style>
</head>
<body>
    
    <table class="primeira">
       <td>
           <h1>Minha Primeira Tabela</h1>
       </td>
    </table>

    <table class="segunda">
     <!--
      HIERARQUIA DE TABELAS(simples)   
       TABLE=tabela
         TABLE ROW=linha de tabela
              TABLE HEADER= Cabeçalho de Tabela
                 TABLE DATA=Dados de tabela
     -->
     
     <tr>
        <!--Primeira Linha-->
        <td>A1</td>
        <td>B1</td>
        <td>C1</td>
     </tr>
     <tr>
        <td>A2</td>
        <td>B2</td>
        <td>C2</td>
     </tr>
     <tr>
        
        <td class="butao">A3</td>
        <td>B3</td>
        <td>C3</td>
     </tr>
     <tr>
        <td>A4</td>
        <td>B4</td>
        <td>C4</td>
     </tr>
    </table>
</body>
</html>
