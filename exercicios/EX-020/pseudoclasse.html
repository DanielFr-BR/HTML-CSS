<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>

    <style>
      div{
        display: inline-block;
        background-color: lightgrey;
        text-align: center;
        border: 1px solid black;
        height: 200px;
        width: 200px;

      }

      div{
        padding: 10px;
      }
      
      div:hover{
        background-color: blue;
      }

      button{
       font-size: 1.5em;
       border: 1px thick;
       border-radius: 5px 5px 3px;
       padding: 10px;
      }

      button:hover{
        background-color: black;
        color: white;
        cursor: pointer;
      }
    </style>
</head>
<body>
    <div id="d1">01</div>
    <div id="d2">02</div>
    <div id="d3">03</div>    
    <button>Clique aqui</button>
</body>
</html>
