<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de caixa de Box Level</title>

    <style>
        h1{/*box-level*/
            background-color: lightgray;
            height: 300px;
            width:300px;

            border: 20px solid darkgray;

            outline: 10px solid black;

            margin: 30px auto 40px auto;
           
            padding: 20px;
        }
        a{/*inline-level*/
          font-weight: bold;
          text-decoration: none;  
          color:blue;
          border: 2px solid rgb(1, 163, 237);
          border-radius: 6px;
          
          padding-top: 3px;
          padding-right: 3px;
          padding-bottom: 3px;
          padding-left: 3px;
        }
    </style>
</head>
<body>
  <h1>Exemplos de caixa de box-level</h1>  


  <p>Páragrafos tambem são exemplos de box-level , mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
